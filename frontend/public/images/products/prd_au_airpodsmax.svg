      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="50%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#1a1e2b"/>
    </linearGradient>
    <linearGradient id="glow_prd_au_airpodsmax" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#999999" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#999999" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg_prd_au_airpodsmax)"/>
  <circle cx="200" cy="140" r="100" fill="url(#glow_prd_au_airpodsmax)"/>
  
  <!-- Device Art -->
  <g>
        <path d="M135 155 A65 65 0 0 1 265 155" fill="none" stroke="#999999" stroke-width="12" stroke-linecap="round"/>
        <rect x="120" y="145" width="30" height="60" rx="14" fill="#1a1c24" stroke="#999999" stroke-width="3"/>
        <rect x="250" y="145" width="30" height="60" rx="14" fill="#1a1c24" stroke="#999999" stroke-width="3"/>
        <circle cx="135" cy="175" r="7" fill="#999999"/>
        <circle cx="265" cy="175" r="7" fill="#999999"/>
        <text x="200" y="195" font-family="sans-serif" font-size="10" font-weight="700" fill="#999999" text-anchor="middle">ANC STEREO</text>
        </g>
  
  <!-- Spec / Brand Pill Header -->
  <g transform="translate(20, 20)">
    <rect width="90" height="22" rx="11" fill="#202430" stroke="#33384a" stroke-width="1"/>
    <text x="45" y="15" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="700" fill="#999999" text-anchor="middle" letter-spacing="0.8">APPLE</text>
  </g>
  <g transform="translate(290, 20)">
    <rect width="90" height="22" rx="11" fill="#1b2e24" stroke="#25543c" stroke-width="1"/>
    <text x="45" y="15" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" font-weight="700" fill="#4ade80" text-anchor="middle" letter-spacing="0.5">VERIFIED AUDIT</text>
  </g>
  
  <!-- Footer Title Bar -->
  <rect x="0" y="250" width="400" height="50" fill="#0b0c10" opacity="0.85"/>
  <text x="200" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="600" fill="#f8fafc" text-anchor="middle">Apple AirPods Max</text>
