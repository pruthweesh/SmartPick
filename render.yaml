# ====================================================================
# Render Blueprint Specification for SmartPick FastAPI Backend
# ====================================================================
services:
  - type: web
    name: smartpick-fastapi-backend
    runtime: python
    rootDir: backend/python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt && python seed.py"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./smartpick.db
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
